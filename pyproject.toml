[build-system]
requires = ["hatchling>=1.17.0"]
build-backend = "hatchling.build"

[project]
name = "aise"
version = "0.1.0"
description = "Bridging research problems of the fields AI safety and AI ethics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "adjusttext>=1.3.0",
    "bertopic>=0.17.3",
    "jsonlines>=4.0.0",
    "nltk>=3.9.2",
    "openai>=2.8.1",
    "pandas>=2.3.2",
    "pip>=25.2",
    "pydot>=4.0.1",
    "seaborn>=0.13.2",
    "spacy>=3.8.7",
    "typer>=0.19.2",
]

[project.scripts]
aise = "aise.cli:app"

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = [
    "ALL",
]
ignore = [
    "ANN",
    "COM",
    "C90",
    "DJ",
    "EXE",
    "T10",
    "TID",
    "FBT",
    "T201",
    "S603",
    "N806",
    "N803",
    "PLR0913",
    "PLR0912",
    "PLR0915",
    "B008",
    "TRY003",
    "EM102",
    "EM101",    # short exception messages inline, as with EM102
    "PLR0917",  # as PLR0913: figure functions take many settings
    "PLR2004",  # plotting thresholds and sizes read best in place
    "D203",     # incompatible with D211, which the docstrings follow
    "D213",     # incompatible with D212, which the docstrings follow
    "D401",     # docstrings may describe what a function returns, as a noun phrase
    "CPY001",   # no per-file copyright notices; see LICENSE
    "S311",     # random draws sample papers, not secrets
    "N812",     # modules are imported by initial: engagement as E
    "PD010",    # .unstack and .stack read better than pivot_table and melt here
    "PD013",
]
# typographic characters in figure labels and in patterns matching PDF text
allowed-confusables = ["–", "‘", "’"]

[tool.ruff.lint.per-file-ignores]
# the NLP libraries are imported where used, so that the CLI starts quickly
"src/aise/analysis.py" = ["PLC0415"]
